# Git identities. personal is the default; each profile applies to repos under
# ~/Projects/Work/<profile>/ (case-insensitive) and to any repo whose remote is in
# one of its GitHub orgs (also during clone). The profile sets core.sshCommand to
# its key. HTTPS URLs for its orgs are rewritten to SSH, so terraform init uses it.
# Adding a profile also needs dot_gitconfig-<profile>.tmpl and
# private_dot_ssh/id_ed25519_<profile>.pub.tmpl stubs.
# Set `archived: true` on a profile to drop it from the setup but keep its data.
